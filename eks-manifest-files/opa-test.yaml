apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: nginx:latest
        securityContext:
          runAsNonRoot: true
        ports:
        - containerPort: 8080
        volumeMounts:
        - mountPath: /data
          name: data-volume
          readOnly: true
      volumes:
      - name: data-volume
        emptyDir: {}