name: Security Scans

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast-scan:
    name: SAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -e package-lock.json ]; then
            npm ci
          elif [ -e yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            npm install
          fi

      - name: Create results directory
        run: mkdir -p semgrep-results

      - name: Run Semgrep
        id: semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/nodejs
            p/javascript
          output: semgrep-results/semgrep.sarif
          metrics: 'off'
          quiet: false
          verbose: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          SEMGREP_TIMEOUT: 300
        continue-on-error: true

      - name: Check Semgrep results
        id: check-results
        if: always()
        run: |
          if [ -f "semgrep-results/semgrep.sarif" ]; then
            echo "SARIF file exists"
            echo "has_results=true" >> $GITHUB_OUTPUT
          else
            echo "No SARIF file found"
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Semgrep results
        if: steps.check-results.outputs.has_results == 'true'
        uses: github/codeql-action/upload-sarif@v3.22.12
        with:
          sarif_file: semgrep-results/semgrep.sarif
          category: 'sast/semgrep'

      - name: Run tests with coverage
        run: npm run test:cov

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'jomacs-devsecops-project' }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'jomacs' }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sources=.
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.branch.target=main
            -Dsonar.qualitygate.wait=true

  dependency-check:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run NPM Audit
        run: npm audit --json --audit-level=high > npm-audit-report.json || true

      - name: Check Snyk Authentication
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "::error::SNYK_TOKEN is not set in repository secrets. Please add it to continue with Snyk scans."
            exit 1
          fi

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          NODE_ENV: production
        with:
          args: >-
            --severity-threshold=high
            --all-projects
            --detection-depth=4
            --prune-repeated-subdependencies
            --strict-out-of-sync=false
            --json > snyk-results.json
        continue-on-error: true

      - name: Monitor project in Snyk
        if: success() && env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          NODE_ENV: production
        with:
          command: monitor
          args: >-
            --all-projects
            --detection-depth=4
            --prune-repeated-subdependencies

      - name: Upload Snyk Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-scan-results
          path: |
            snyk-results.json
            npm-audit-report.json

  container-scan:
    name: Container Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          version: latest

      - name: Build Node.js application image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: jomacs-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
          outputs: type=docker,dest=/tmp/jomacs-app.tar

      - name: Verify image build
        run: |
          if [ ! -f "/tmp/jomacs-app.tar" ]; then
            echo "::error::Docker image build failed - image archive not found"
            exit 1
          fi
          docker load < /tmp/jomacs-app.tar
          if ! docker image inspect jomacs-app:${{ github.sha }} >/dev/null 2>&1; then
            echo "::error::Docker image not found after loading"
            exit 1
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.17.0
        with:
          image-ref: jomacs-app:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          timeout: '10m0s'
          scanners: 'vuln,secret,config'
          hide-progress: false
          exit-code: '1'
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3.22.12
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-security'

      - name: Run Anchore Container Scan
        uses: anchore/scan-action@v3.3.6
        with:
          image: jomacs-app:${{ github.sha }}
          fail-build: false
          severity-cutoff: high
          acs-report-enable: true
        continue-on-error: true

      - name: Upload Anchore scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3.22.12
        with:
          sarif_file: 'anchore-results.sarif'
          category: 'container-security/anchore'

      - name: Clean up
        if: always()
        run: |
          docker image rm jomacs-app:${{ github.sha }} || true
          rm -f /tmp/jomacs-app.tar || true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for full history scan

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_REPORT_PATH: gitleaks-report.sarif
        continue-on-error: true

      - name: Upload Gitleaks results
        if: always() && steps.gitleaks.outputs.result != ''
        uses: github/codeql-action/upload-sarif@v3.22.12
        with:
          sarif_file: gitleaks-report.sarif
          category: 'secret-scanning'

      - name: Run TruffleHog
        id: trufflehog
        uses: trufflesecurity/trufflehog@v3.63.7
        continue-on-error: true
        with:
          path: ./
          base: ""
          extra_args: >-
            --debug
            --only-verified
            --json
            --fail
            --no-update
            --github-actions

      - name: Generate SARIF from TruffleHog output
        if: always()
        run: |
          # Create default SARIF structure
          echo '{
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "TruffleHog",
                    "informationUri": "https://github.com/trufflesecurity/trufflehog",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }' > trufflehog-results.sarif

          # If TruffleHog found any results, process them
          if [ -f "trufflehog.json" ]; then
            # Convert TruffleHog JSON output to SARIF format
            jq --arg pwd "$PWD" '
            {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                "tool": {
                  "driver": {
                    "name": "TruffleHog",
                    "informationUri": "https://github.com/trufflesecurity/trufflehog",
                    "rules": []
                  }
                },
                "results": [
                  .[] | select(. != null) | {
                    "ruleId": .DetectorName,
                    "level": "error",
                    "message": {
                      "text": "Found secret: \(.Description)"
                    },
                    "locations": [{
                      "physicalLocation": {
                        "artifactLocation": {
                          "uri": (.SourceMetadata.Data.Git.file // "unknown")
                        },
                        "region": {
                          "startLine": (.SourceMetadata.Data.Git.line // 1),
                          "endLine": (.SourceMetadata.Data.Git.line // 1)
                        }
                      }
                    }]
                  }
                ]
              }]
            }' trufflehog.json > trufflehog-results.sarif || true
          fi

      - name: Verify SARIF file
        if: always()
        run: |
          if [ ! -f "trufflehog-results.sarif" ]; then
            echo "::error::SARIF file was not generated"
            exit 1
          fi
          if ! jq empty trufflehog-results.sarif 2>/dev/null; then
            echo "::error::Generated SARIF file is not valid JSON"
            exit 1
          fi

      - name: Upload TruffleHog results
        if: always()
        uses: github/codeql-action/upload-sarif@v3.22.12
        with:
          sarif_file: trufflehog-results.sarif
          category: 'secret-scanning/trufflehog'
          wait-for-processing: true 