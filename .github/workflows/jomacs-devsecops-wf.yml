name: jomacs-devsecops-project

on:
  workflow_dispatch:
    inputs:
      devsecops_action:
        type: choice
        description: Select Action
        options:
          - sast
          - deploy
          - dast
        required: true
    
permissions:
  checks: write
  contents: write
 
jobs:
  sast:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.devsecops_action == 'sast' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SAST Scan
        run: npm audit --json --audit-level=none > npm-audit-report.json

      - name: Upload NPM-audit Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json

      - name: Manual scan for passwords & Secret keys
        run: grep -r -e "password" -e "secret" -e "keys" .
        
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v0.62.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/
          opa version

      - name: Install yq
        run: sudo snap install yq

      - name: Debug File Check
        run: ls -l ./eks-manifest-files/opa-test.yaml ./opa-policies/security.rego

      - name: Convert Deployment YAML to JSON
        run: |
          yq eval -o=json ./eks-manifest-files/opa-test.yaml > opa-test.json
          cat opa-test.json

      - name: Run OPA Policy Check
        run: |
          mkdir -p logs
          opa eval --input opa-test.json --data ./opa-policies/security.rego --format pretty "data.security.allow" > logs/result.txt 2> logs/opa-error.txt || { echo "OPA eval failed"; cat opa-test.json > logs/input.json; cat logs/opa-error.txt; exit 1; }
          cat logs/result.txt
          if grep -q "true" logs/result.txt; then
            echo "Policy check passed!"
          else
            echo "Policy check failed:"
            opa eval --input opa-test.json --data ./opa-policies/security.rego --format pretty "data.security.violations" > logs/violations.txt
            cat logs/violations.txt
            exit 1
          fi

      - name: Upload OPA Evaluation Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opa-evaluation-logs
          path: logs/*
          retention-days: 7

