# Required properties
sonar.projectKey=jomacs-devsecops-project
sonar.organization=jomacs

# Project information
sonar.projectName=Jomacs DevSecOps Project
sonar.projectVersion=1.0

# Source code location
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/test/**,**/coverage/**,**/dist/**

# Test coverage configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/test/**

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Analysis settings
sonar.verbose=false 