# Required properties
sonar.projectKey=jomacs-devsecops-project
sonar.organization=jomacs

# Project information
sonar.projectName=Jomacs DevSecOps Project
sonar.projectVersion=1.0

# Source code location
sonar.sources=.
sonar.exclusions=**/*.test.js,**/*.spec.js,**/tests/**,**/coverage/**,**/.github/**
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Test coverage configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/tests/**,jest.config.js

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Analysis settings
sonar.verbose=true

# Quality Gate configuration
sonar.qualitygate.wait=true

# Branch configuration
sonar.branch.autoconfig.disabled=false
sonar.branch.name=${env.GITHUB_REF_NAME}
sonar.branch.target=main 